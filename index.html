<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FrameUp Demo</title>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="logo"><i></i>FrameUp</div>
    <div class="roles" role="group" aria-label="Choose a role">
      <button id="role-student" data-role="student" aria-pressed="true">Student</button>
      <button id="role-teacher" data-role="teacher" aria-pressed="false">Teacher</button>
      <button id="role-admin" data-role="admin" aria-pressed="false">Admin</button>
    </div>
  </div>
  <main id="app"></main>
</div>
<div class="toast" id="toast" hidden></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
